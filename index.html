<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihit Fitness Club - Add New Member</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-gray-800 shadow-2xl rounded-3xl p-6 border border-gray-700">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <div>
                <h1 class="text-xl font-bold text-yellow-400 tracking-wider">⚡ NIHIT FITNESS CLUB</h1>
                <p class="text-xs text-gray-400 mt-0.5">Ledhupur, Varanasi | Add New Member</p>
            </div>
            <a href="admin.html" class="bg-gray-700 hover:bg-gray-600 text-yellow-400 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>

        <!-- Add Member Form -->
        <form id="addMemberForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter member's full name" 
                    class="w-full bg-gray-700 text-white px-4 py-2.5 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Mobile Number</label>
                <input type="tel" id="mobile" required placeholder="10-digit mobile number" pattern="[0-9]{10}"
                    class="w-full bg-gray-700 text-white px-4 py-2.5 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Membership Plan</label>
                <select id="plan" class="w-full bg-gray-700 text-white px-4 py-2.5 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-sm">
                    <option value="Monthly (Standard)">Monthly (Standard)</option>
                    <option value="3 Months Special">3 Months Special</option>
                    <option value="6 Months Package">6 Months Package</option>
                    <option value="Annual VIP">Annual VIP</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black py-3 rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2 mt-2">
                <i class="fas fa-user-plus"></i> Register Member
            </button>
        </form>

        <!-- Response Message -->
        <div id="formMessage" class="mt-4 hidden p-3 rounded-xl text-xs font-semibold text-center"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://upmjbcbodnsbpfyouzkl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwbWpiY2JvZG5zYnBmeW91emtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2NjYsImV4cCI6MjA1NjgxNDY2Nn0.V5zXJkF6Y6F3k1vK8K5K5K5K5K5K5K5K5K5K5K5K5K5";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const plan = document.getElementById('plan').value;
            const msgBox = document.getElementById('formMessage');
            const submitBtn = document.getElementById('submitBtn');

            // Generate unique Member ID like NFC-xxxx
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            const memberId = `NFC-${randomNum}`;

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            const { data, error } = await supabase
                .from('members')
                .insert([{
                    member_id: memberId,
                    full_name: fullName,
                    mobile: mobile,
                    plan: plan
                }]);

            if (error) {
                console.error("Error inserting member:", error);
                showMsg("❌ Error registering member. Try again.", "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "Register Member";
                return;
            }

            showMsg(`✅ Member Registered Successfully!\nMember ID: ${memberId}`, "success");
            document.getElementById('addMemberForm').reset();
            
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 1500);
        }

        function showMsg(text, type) {
            const msgBox = document.getElementById('formMessage');
            msgBox.className = "mt-4 p-3 rounded-xl text-xs font-semibold whitespace-pre-line text-center " + 
                (type === "success" ? "bg-green-500/20 text-green-400 border border-green-500/30" : "bg-red-500/20 text-red-400 border border-red-500/30");
            msgBox.innerText = text;
            msgBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
