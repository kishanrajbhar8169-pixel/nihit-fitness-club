<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihit Fitness Club - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">

    <div class="container mx-auto max-w-6xl">
        <!-- Header -->
        <header class="bg-gray-800 shadow-xl rounded-2xl p-6 mb-6 flex justify-between items-center border border-gray-700">
            <div>
                <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">⚡ NIHIT FITNESS CLUB</h1>
                <p class="text-xs text-gray-400 mt-1">Ledhupur, Varanasi | Admin & Portal</p>
            </div>
            <button onclick="fetchMembersData()" class="bg-yellow-400 hover:bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold shadow-md transition">
                <i class="fas fa-sync-alt"></i> Refresh Stats
            </button>
        </header>

        <!-- Stats Boxes -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs text-gray-400 uppercase font-semibold">Total Members</p>
                <h3 class="text-3xl font-bold text-white mt-1" id="totalMembersCount">0</h3>
            </div>
            <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs text-gray-400 uppercase font-semibold">Active Members</p>
                <h3 class="text-3xl font-bold text-green-400 mt-1" id="activeMembersCount">0</h3>
            </div>
            <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs text-gray-400 uppercase font-semibold">Today's Attendance</p>
                <h3 class="text-3xl font-bold text-yellow-400 mt-1">0</h3>
            </div>
            <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs text-gray-400 uppercase font-semibold">Pending Fees</p>
                <h3 class="text-3xl font-bold text-red-400 mt-1">0</h3>
            </div>
        </div>

        <!-- Quick Controls -->
        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow mb-6">
            <p class="text-xs text-gray-400 uppercase font-bold mb-3">🛠️ Quick Controls</p>
            <div class="flex flex-wrap gap-3">
                <a href="index.html" class="bg-yellow-400 hover:bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold shadow transition flex items-center gap-2">
                    <i class="fas fa-user-plus"></i> Add New Member
                </a>
                <a href="checkin.html" class="bg-emerald-500 hover:bg-emerald-600 text-black px-4 py-2 rounded-xl text-sm font-bold shadow transition flex items-center gap-2">
                    <i class="fas fa-qrcode"></i> PhonePe Style Self-Checkin QR
                </a>
            </div>
        </div>

        <!-- Recent Members List -->
        <div class="bg-gray-800 shadow-xl rounded-2xl overflow-hidden border border-gray-700">
            <div class="p-4 border-b border-gray-700">
                <h3 class="font-bold text-yellow-400">📋 Recent Members List</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-yellow-400 text-xs uppercase tracking-wider">
                            <th class="p-4">Member ID</th>
                            <th class="p-4">Full Name</th>
                            <th class="p-4">Mobile</th>
                            <th class="p-4">Plan</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody" class="text-gray-300 text-sm divide-y divide-gray-700">
                        <!-- Data loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://upmjbcbodnsbpfyouzkl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwbWpiY2JvZG5zYnBmeW91emtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2NjYsImV4cCI6MjA1NjgxNDY2Nn0.V5zXJkF6Y6F3k1vK8K5K5K5K5K5K5K5K5K5K5K5K5K5";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchMembersData() {
            const { data, error } = await supabase
                .from('members')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching members:', error);
                return;
            }

            const members = data || [];
            document.getElementById('totalMembersCount').innerText = members.length;
            document.getElementById('activeMembersCount').innerText = members.length;

            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';

            if (members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No members found</td></tr>`;
                return;
            }

            members.forEach(member => {
                const memberName = member.full_name || member.name || "N/A";
                const memberMobile = member.mobile || member.mobile_number || "N/A";
                const memberId = member.member_id || "N/A";
                const memberPlan = member.plan || member.membership_plan || "Monthly (Standard)";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-750 transition";
                tr.innerHTML = `
                    <td class="p-4 font-bold text-yellow-400">${memberId}</td>
                    <td class="p-4 font-semibold text-white">${memberName}</td>
                    <td class="p-4 font-medium text-gray-300">${memberMobile}</td>
                    <td class="p-4 text-gray-300">${memberPlan}</td>
                    <td class="p-4"><span class="bg-green-500/20 text-green-400 px-2.5 py-1 rounded-full text-xs font-bold">Paid</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        fetchMembersData();
    </script>
</body>
</html>
