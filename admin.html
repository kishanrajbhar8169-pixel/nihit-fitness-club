<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihit Fitness Club - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">

    <div class="container mx-auto max-w-6xl">
        <!-- Header -->
        <header class="bg-gray-800 shadow-xl rounded-2xl p-6 mb-6 flex justify-between items-center border border-gray-700">
            <div>
                <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">⚡ NIHIT FITNESS CLUB</h1>
                <p class="text-xs text-gray-400 mt-1">Ledhupur, Varanasi | Admin Dashboard</p>
            </div>
            <a href="checkin.html" class="bg-yellow-400 hover:bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold shadow-md transition">
                <i class="fas fa-qrcode"></i> Check-in Page
            </a>
        </header>

        <!-- Search Bar -->
        <div class="bg-gray-800 shadow-xl rounded-2xl p-4 mb-6 flex justify-between items-center border border-gray-700">
            <input type="text" id="searchInput" placeholder="Search by name or mobile..." 
                class="w-full md:w-1/3 bg-gray-700 text-white px-4 py-2 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400">
            <div class="text-sm font-semibold text-yellow-400" id="totalMembersCount">Total Members: 0</div>
        </div>

        <!-- Members Table -->
        <div class="bg-gray-800 shadow-xl rounded-2xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-yellow-400 text-xs uppercase tracking-wider">
                            <th class="p-4">Member ID</th>
                            <th class="p-4">Full Name</th>
                            <th class="p-4">Mobile</th>
                            <th class="p-4">Join Date</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">WhatsApp Reminder</th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody" class="text-gray-300 text-sm divide-y divide-gray-700">
                        <!-- Data loaded dynamically from Supabase -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://upmjbcbodnsbpfyouzkl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwbWpiY2JvZG5zYnBmeW91emtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2NjYsImV4cCI6MjA1NjgxNDY2Nn0.V5zXJkF6Y6F3k1vK8K5K5K5K5K5K5K5K5K5K5K5K5K5";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allMembers = [];

        async function fetchMembers() {
            try {
                const { data, error } = await supabase
                    .from('members')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Supabase Error:', error.message);
                    return;
                }

                allMembers = data || [];
                renderTable(allMembers);
            } catch (err) {
                console.error('Fetch Exception:', err);
            }
        }

        function renderTable(members) {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '';
            document.getElementById('totalMembersCount').innerText = `Total Members: ${members.length}`;

            const today = new Date();

            if (members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400">Koi member nahi mila!</td></tr>`;
                return;
            }

            members.forEach(member => {
                const memberName = member.full_name || member.name || "N/A";
                const memberMobile = member.mobile || member.mobile_number || "N/A";
                const memberId = member.member_id || "N/A";

                const joinDate = new Date(member.created_at || member.join_date || Date.now());
                const diffTime = Math.abs(today - joinDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const isExpired = diffDays >= 30;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-750 transition";

                const messageText = encodeURIComponent(`Hello ${memberName}, your monthly membership at Nihit Fitness Club, Ledhupur is due/expired. Please clear your dues. Thank you!`);
                const whatsappLink = `https://wa.me/91${memberMobile}?text=${messageText}`;

                tr.innerHTML = `
                    <td class="p-4 font-bold text-yellow-400">${memberId}</td>
                    <td class="p-4 font-semibold text-white">${memberName}</td>
                    <td class="p-4 font-medium text-gray-300">${memberMobile}</td>
                    <td class="p-4 text-gray-400">${joinDate.toLocaleDateString('en-IN')}</td>
                    <td class="p-4">
                        ${isExpired ? '<span class="text-red-400 font-bold bg-red-500/10 px-2 py-1 rounded">Due</span>' : '<span class="text-green-400 font-medium bg-green-500/10 px-2 py-1 rounded">Active</span>'}
                    </td>
                    <td class="p-4 text-center">
                        <a href="${whatsappLink}" target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-xl text-xs font-semibold inline-flex items-center gap-1 shadow">
                            <i class="fab fa-whatsapp"></i> Reminder
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Live Search Filter Handler
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allMembers.filter(m => {
                const name = (m.full_name || m.name || '').toLowerCase();
                const mobile = (m.mobile || m.mobile_number || '').toString();
                const id = (m.member_id || '').toLowerCase();
                return name.includes(query) || mobile.includes(query) || id.includes(query);
            });
            renderTable(filtered);
        });

        fetchMembers();
    </script>
</body>
</html>
