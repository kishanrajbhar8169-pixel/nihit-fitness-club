<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihit Fitness Club - Member Check-in Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 shadow-2xl rounded-3xl p-6 border border-gray-700 text-center">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">⚡ NIHIT FITNESS CLUB</h1>
            <p class="text-xs text-gray-400 mt-1">Ledhupur, Varanasi | Self Check-in Portal</p>
        </div>

        <!-- Check-in Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-300 font-semibold mb-2 text-left">Enter Member ID or Mobile Number</label>
                <input type="text" id="checkinInput" placeholder="e.g., NFC-8741 or Mobile Number" 
                    class="w-full bg-gray-700 text-white px-4 py-3 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-center text-lg font-bold tracking-wider">
            </div>

            <button onclick="markAttendance()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black py-3 rounded-xl font-bold text-base shadow-lg transition flex items-center justify-center gap-2">
                <i class="fas fa-check-circle"></i> Mark Attendance
            </button>
        </div>

        <!-- Response Message Box -->
        <div id="responseMessage" class="mt-6 hidden p-4 rounded-xl text-sm font-semibold"></div>

        <!-- Navigation Link -->
        <div class="mt-6 pt-4 border-t border-gray-700">
            <a href="admin.html" class="text-xs text-gray-400 hover:text-yellow-400 transition flex items-center justify-center gap-1">
                <i class="fas fa-lock"></i> Go to Admin Dashboard
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://upmjbcbodnsbpfyouzkl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwbWpiY2JvZG5zYnBmeW91emtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2NjYsImV4cCI6MjA1NjgxNDY2Nn0.V5zXJkF6Y6F3k1vK8K5K5K5K5K5K5K5K5K5K5K5K5K5";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function markAttendance() {
            const inputVal = document.getElementById('checkinInput').value.trim();
            const msgBox = document.getElementById('responseMessage');

            if (!inputVal) {
                showMsg("Please enter your Member ID or Mobile Number!", "error");
                return;
            }

            // 1. Search member in 'members' table by member_id or mobile
            const { data: members, error } = await supabase
                .from('members')
                .select('*')
                .or(`member_id.eq.${inputVal},mobile.eq.${inputVal}`);

            if (error || !members || members.length === 0) {
                showMsg("❌ Member not found! Please check your ID or Mobile Number.", "error");
                return;
            }

            const member = members[0];
            const memberName = member.full_name || member.name;

            // 2. Insert attendance record into 'attendance' table
            const { error: attError } = await supabase
                .from('attendance')
                .insert([{ member_id: member.member_id, full_name: memberName }]);

            if (attError) {
                console.error("Attendance Error:", attError);
                showMsg("⚠️ Error recording attendance. Try again.", "error");
                return;
            }

            showMsg(`✅ Attendance Successful!\nWelcome, ${memberName}! 💪`, "success");
            document.getElementById('checkinInput').value = '';
        }

        function showMsg(text, type) {
            const msgBox = document.getElementById('responseMessage');
            msgBox.className = "mt-6 p-4 rounded-xl text-sm font-semibold whitespace-pre-line " + 
                (type === "success" ? "bg-green-500/20 text-green-400 border border-green-500/30" : "bg-red-500/20 text-red-400 border border-red-500/30");
            msgBox.innerText = text;
            msgBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
