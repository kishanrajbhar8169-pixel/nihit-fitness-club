<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Self Check-In | NIHIT FITNESS CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl p-6 border border-gray-700">
        <!-- Gym Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">⚡ NIHIT FITNESS CLUB</h1>
            <p class="text-xs text-gray-400 mt-1">Ladhupur, Varanasi | Daily Attendance Portal</p>
        </div>

        <!-- Check-in Form -->
        <form id="checkinForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Mobile Number ya Member ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-user-check"></i>
                    </span>
                    <input type="text" id="memberInput" required placeholder="Ex: 8953498882 ya NFC-8741" 
                        class="w-full pl-10 pr-4 py-3 bg-gray-700 text-white rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-center font-semibold text-lg">
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl shadow-lg transition duration-200 text-lg flex items-center justify-center gap-2">
                <i class="fas fa-qrcode"></i> Attendance Mark Karein
            </button>
        </form>

        <!-- Message Alert -->
        <div id="alertBox" class="mt-4 hidden p-3 rounded-xl text-center text-sm font-medium"></div>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-gray-500 border-t border-gray-700 pt-4">
            Welcome to Gym! Keep Grinding 💪
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://upmjbcbodnsbpfyouzkl.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwbWpiY2JvZG5zYnBmeW91emtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2NjYsImV4cCI6MjA1NjgxNDY2Nn0.V5zXJkF6Y6F3k1vK8K5K5K5K5K5K5K5K5K5K5K5K5K5";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const checkinForm = document.getElementById('checkinForm');
        const memberInput = document.getElementById('memberInput');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, isSuccess) {
            alertBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium border";
            if (isSuccess) {
                alertBox.classList.add('bg-green-500/20', 'text-green-400', 'border-green-500');
            } else {
                alertBox.classList.add('bg-red-500/20', 'text-red-400', 'border-red-500');
            }
            alertBox.innerText = message;
        }

        checkinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputVal = memberInput.value.trim();
            if (!inputVal) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            try {
                const { data: members, error } = await supabase
                    .from('members')
                    .select('*')
                    .or(`mobile.eq.${inputVal},member_id.eq.${inputVal}`);

                if (error || !members || members.length === 0) {
                    showAlert("❌ Member Nahi Mila! Sahi Mobile ya ID daalein.", false);
                } else {
                    const member = members[0];
                    const today = new Date().toISOString().split('T')[0];

                    const { data: existingAttendance } = await supabase
                        .from('attendance')
                        .select('*')
                        .eq('member_id', member.member_id)
                        .eq('date', today);

                    if (existingAttendance && existingAttendance.length > 0) {
                        showAlert(`⚠️ ${member.full_name}, Aaj ki attendance pehle se lagi hui hai!`, false);
                    } else {
                        const { error: attError } = await supabase
                            .from('attendance')
                            .insert([{ member_id: member.member_id, date: today, time: new Date().toLocaleTimeString() }]);

                        if (attError) {
                            showAlert("❌ Attendance mark karne me error aayi.", false);
                        } else {
                            showAlert(`✅ Welcome ${member.full_name}! Attendance lag gayi hai.`, true);
                            memberInput.value = '';
                        }
                    }
                }
            } catch (err) {
                showAlert("❌ Connection Error! Internet check karein.", false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-qrcode"></i> Attendance Mark Karein';
            }
        });
    </script>
</body>
</html>
